<mat-card class="container-card">
    <mat-card-header class="mb-3">
        <mat-card-title>{{ title | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="content">        
        <div class="btn-group-ltt">
            <button mat-raised-button color="primary" class="custom-button-color" (click)="lastToursF()">{{ button1Text | translate }}</button>
            <button mat-raised-button color="primary" class="custom-button-color" (click)="closestToursF()">{{ button2Text | translate }}</button>
        </div>
        <div class="type-chips">
            <button class="chip" [class.chip--active]="activeType === 'cultural'" (click)="filterByType('cultural')">
                <img src="assets/iconos/TdesignMuseum1.svg" [attr.alt]="'CARDS.Filter_cultural' | translate"> {{ 'CARDS.Filter_cultural' | translate }}
            </button>
            <button class="chip" [class.chip--active]="activeType === 'naturaleza'" (click)="filterByType('naturaleza')">
                <img src="assets/iconos/HealthiconsForestPersons.svg" [attr.alt]="'CARDS.Filter_naturaleza' | translate"> {{ 'CARDS.Filter_naturaleza' | translate }}
            </button>
            <button class="chip" [class.chip--active]="activeType === 'ocio'" (click)="filterByType('ocio')">
                <img src="assets/iconos/MapAmusementPark.svg" [attr.alt]="'CARDS.Filter_ocio' | translate"> {{ 'CARDS.Filter_ocio' | translate }}
            </button>
        </div>
        <div fxLayout="row" fxLayoutAlign="space-around center" fxLayoutGap="16px" class="card-contianer" *ngIf="lastTours">       
            <app-generic-card [toursdata]=lastTours class="d-flex"></app-generic-card>
        </div>
        <div class="mt-5 d-flex justify-content-center">
            <button mat-raised-button color="primary" class="custom-button-color" routerLink="/alltours">{{ 'CARDS.More_options' | translate }}</button>
        </div>
    </mat-card-content>
</mat-card>
