<div class="edit-profile-container">
  <mat-card class="container-card">
    <mat-card-header>
      <mat-card-title>Editar Mi Perfil</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">

        <!-- Avatar actual + selector -->
        <div class="form-field avatar-field">
          <p>Imagen de Perfil</p>
          <div class="avatar-preview">
            <img [src]="imageSrc || currentAvatar || '../../../assets/iconos/Default-Profile-Picture-PNG-Transparent-Image.png'"
                 class="profile-image-preview" alt="avatar" />
          </div>
          <input #profileImageInput type="file" (change)="onFileSelect($event)" accept="image/*" hidden>
          <button mat-stroked-button type="button" (click)="profileImageInput.click()">
            Cambiar foto
          </button>
          <span class="file-name" *ngIf="fileName">{{ fileName }}</span>
        </div>

        <div class="form-field">
          <p>Nombre</p>
          <mat-form-field appearance="outline">
            <input matInput formControlName="firstName" placeholder="Tu nombre">
          </mat-form-field>
        </div>

        <div class="form-field">
          <p>Apellido</p>
          <mat-form-field appearance="outline">
            <input matInput formControlName="lastName" placeholder="Tu apellido">
          </mat-form-field>
        </div>

        <div class="form-field">
          <p>Email</p>
          <mat-form-field appearance="outline">
            <input matInput formControlName="email" placeholder="Tu email">
            <mat-error *ngIf="profileForm.controls['email'].errors?.['email']">
              Introduce un email válido.
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-field">
          <p>Biografía</p>
          <mat-form-field appearance="outline">
            <textarea matInput formControlName="bio" rows="3" placeholder="Cuéntanos algo sobre ti..."></textarea>
          </mat-form-field>
        </div>

        <div class="profile-actions">
          <button mat-button type="button" routerLink="/profile">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            {{ loading ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
