<div class="modal-dialog" style="max-width: none; width: 100%; margin: 0 auto;">
  <div class="modal-content">

    <div class="modal-header text-center">
      <h5 class="modal-title w-100">{{ "MAP-MODAL.Let's_go_to_the_next_point" | translate }}</h5>
      <button type="button" class="close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">✕</span>
      </button>
    </div>

    <div class="modal-body mt-3" style="padding: 0;">
      <div id="mapa" style="width: 100%; height: 65vh; position: relative;"></div>
    </div>

    <div class="modal-footer">

      <!-- Google Maps — protagonista -->
      <a class="gmaps-btn"
         href="https://www.google.com/maps/dir/?api=1&origin=My+Location&destination={{lat}},{{long}}"
         target="_blank">
        <img src="../../../assets/iconos/google-maps-icon.svg" alt="Google Maps"
             class="gmaps-btn__icon" onerror="this.style.display='none'">
        {{ "MAP-MODAL.Prefer_Google_Maps?_Click_Here" | translate }}
      </a>

      <!-- "He llegado" — secundario -->
      <button type="button" class="arrived-btn" (click)="closeModal()">
        {{ "MAP-MODAL.I_arrived" | translate }}
      </button>

    </div>
  </div>
</div>
