<div class="vtd">

  <!-- Imagen -->
  <div class="vtd__image-wrap" *ngIf="data.tour.imagen?.url">
    <img [src]="data.tour.imagen.url" alt="imagen del tour" class="vtd__image">
  </div>

  <!-- Info -->
  <div class="vtd__body">
    <span class="vtd__type">{{ data.tour.tipo_de_tour }}</span>
    <h2 class="vtd__title">{{ data.tour.titulo }}</h2>
    <p class="vtd__desc">{{ data.tour.descripcion }}</p>

    <div class="vtd__meta">
      <span class="vtd__meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        {{ data.tour.duracion }} min
      </span>
      <span class="vtd__meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        {{ data.tour.recorrido }} km
      </span>
      <span class="vtd__meta-item" *ngIf="data.tour.pasos_count > 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        {{ data.tour.pasos_count }} pasos
      </span>
    </div>

    <div class="vtd__author">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      {{ data.tour.user?.first_name }} {{ data.tour.user?.last_name }}
      <span class="vtd__author-email">{{ data.tour.user?.email }}</span>
    </div>

    <!-- Form de rechazo -->
    <div class="vtd__reject-form" *ngIf="showRejectForm">
      <label class="vtd__reject-label">Motivo del rechazo (opcional)</label>
      <textarea class="vtd__reject-textarea" [(ngModel)]="rejectReason"
        placeholder="Ej: Las imágenes no cumplen la calidad mínima..." rows="3"></textarea>
    </div>
  </div>

  <!-- Acciones -->
  <div class="vtd__actions">
    <button mat-button (click)="dialogRef.close(null)">Cancelar</button>
    <button mat-stroked-button color="warn" (click)="reject()">
      {{ showRejectForm ? 'Confirmar rechazo' : 'Rechazar' }}
    </button>
    <button mat-raised-button color="primary" (click)="approve()" *ngIf="!showRejectForm">
      Aprobar y publicar
    </button>
  </div>

</div>
