<div class="ltt-reg-success">
  <div class="ltt-reg-success__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </div>
  <h1 class="ltt-reg-success__title">{{ 'REGISTRATION.Title' | translate }}</h1>
  <p class="ltt-reg-success__subtitle">{{ 'REGISTRATION.Subtitle' | translate }}</p>

  <div class="ltt-reg-success__actions">
    <button mat-raised-button color="primary" (click)="goToProfile()">
      {{ 'REGISTRATION.Go_profile' | translate }}
    </button>
    <button mat-stroked-button (click)="goToHome()">
      {{ 'REGISTRATION.Go_home' | translate }}
    </button>
  </div>
</div>
