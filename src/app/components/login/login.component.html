<div class="ppal-container d-flex justify-content-center">
  <div class="container-login text-center">
      <div class="row mb-3">
          <div class="col">
              <div class="col-12">
                  <h3 data-cy="loginTitle">{{ 'LOGIN.Title' | translate }}</h3>
              </div>
              <div class="alert alert-danger" *ngIf="authenticationError" data-cy="loginError">
                  <strong>{{ 'LOGIN.Error_title' | translate }}</strong> {{ 'LOGIN.Error_body' | translate }}
              </div>
          </div>
      </div>
      <div class="row card" id="card-login">
          <div class="card-body" id="card-login-body">
              <form class="form" role="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="row mb-3">
                      <div class="col-3 label-login">
                          <label class="email-label" for="email">{{ 'LOGIN.Email' | translate }}</label>
                      </div>
                      <div class="col-6">
                          <input
                              type="text"
                              class="form-control"
                              name="email"
                              id="login-email"
                              [placeholder]="'LOGIN.Email' | translate"
                              formControlName="email"
                              #username
                              data-cy="email"
                          />
                      </div>
                  </div>
                  <div class="row mb-3">
                      <div class="col-3 label-login">
                          <label for="password">{{ 'LOGIN.Password' | translate }}</label>
                      </div>
                      <div class="col-6">
                          <input
                              type="password"
                              class="form-control"
                              name="password"
                              id="login-pass"
                              [placeholder]="'LOGIN.Password' | translate"
                              formControlName="password"
                              data-cy="password"
                          />
                      </div>
                  </div>
                  <button mat-raised-button class="login button" type="submit" data-cy="submit">{{ 'LOGIN.Submit' | translate }}</button>
              </form>
          </div>
      </div>
  </div>
</div>
