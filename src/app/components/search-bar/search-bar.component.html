<form class="search-form" (submit)="searchLocation(); $event.preventDefault();">
  <div class="search-wrap">
    <input
      name="searchInput"
      class="search-input"
      [(ngModel)]="searchText"
      (input)="searchLocation()"
      type="text"
      placeholder="{{ 'SEARCH-BAR.Where_do_you_want_to_travel?' | translate }}"
    />
    <button class="search-btn" type="submit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      {{ 'SEARCH-BAR.Search' | translate }}
    </button>
  </div>
  <div class="search-results" *ngIf="searchResults.length">
    <div *ngFor="let result of searchResults" (click)="selectLocation(result)">
      {{ result.display_name }}
    </div>
  </div>
</form>
